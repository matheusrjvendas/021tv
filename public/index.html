<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>021 TV — Todo canal, filme e série. Sem travar.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

  :root{
    --ink:#0E1A22;
    --ink-2:#122430;
    --surface:#152A37;
    --surface-2:#1B3542;
    --line:#25414F;
    --coral:#FF6B4A;
    --coral-dark:#E5532F;
    --turq:#2FD4C8;
    --text:#F4F1EA;
    --text-muted:#9FB3BF;
    --radius-s:6px;
    --radius-m:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.01em;}
  a{color:inherit;}
  img{max-width:100%;display:block;}
  button{font-family:inherit;cursor:pointer;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 28px;}
  .hide{display:none !important;}

  /* ---------- Header ---------- */
  header.site{
    position:sticky;top:0;z-index:40;
    background:rgba(14,26,34,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .nav{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:16px 0;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-0.01em;}
  .brand .dot{
    width:34px;height:34px;border-radius:50%;
    background:linear-gradient(135deg,var(--coral),var(--turq));
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:var(--ink);
    flex:none;
  }
  .navlinks{display:flex;gap:28px;font-size:14.5px;font-weight:600;color:var(--text-muted);}
  .navlinks a{text-decoration:none;transition:color .15s;}
  .navlinks a:hover{color:var(--text);}
  .navcta{display:flex;align-items:center;gap:14px;}
  .userchip{font-size:14px;font-weight:600;color:var(--text-muted);}

  .btn{
    border:none;border-radius:999px;padding:11px 22px;font-weight:700;font-size:14.5px;
    transition:transform .12s, box-shadow .12s, background .12s;
  }
  .btn:active{transform:scale(.97);}
  .btn-solid{background:var(--coral);color:#1a0e08;}
  .btn-solid:hover{background:var(--coral-dark);box-shadow:0 6px 18px rgba(255,107,74,.25);}
  .btn-ghost{background:transparent;color:var(--text);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--turq);color:var(--turq);}
  .btn-turq{background:var(--turq);color:#062521;}
  .btn-turq:hover{background:#26bcb1;}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 16px;font-size:13px;}
  .btn-text{background:none;border:none;color:var(--text-muted);font-size:13px;text-decoration:underline;padding:4px;}

  /* ---------- Hero ---------- */
  .hero{padding:72px 0 60px;position:relative;overflow:hidden;}
  .hero::before{
    content:'';position:absolute;top:-180px;right:-160px;width:560px;height:560px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,107,74,.16), transparent 65%);
    pointer-events:none;
  }
  .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;position:relative;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--turq);
    background:rgba(47,212,200,.1);border:1px solid rgba(47,212,200,.25);padding:6px 14px;border-radius:999px;margin-bottom:18px;
  }
  .eyebrow .pulse{width:7px;height:7px;border-radius:50%;background:var(--turq);box-shadow:0 0 0 3px rgba(47,212,200,.2);}
  .hero h1{font-size:50px;line-height:1.08;font-weight:700;margin:0 0 20px;letter-spacing:-0.02em;}
  .hero h1 .accent{color:var(--coral);}
  .hero p.lead{font-size:17.5px;color:var(--text-muted);max-width:480px;margin:0 0 30px;}
  .hero-actions{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:36px;}
  .hero-stats{display:flex;gap:14px;flex-wrap:wrap;}
  .hero-stats .stat{
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:16px 20px;min-width:132px;flex:1;
  }
  .hero-stats .stat b{display:block;font-family:'Space Grotesk',sans-serif;font-size:26px;color:var(--text);font-weight:700;line-height:1;margin-bottom:6px;}
  .hero-stats .stat span{font-size:12.5px;color:var(--text-muted);}

  .tvmock{
    background:#0A1319;border:10px solid #061014;border-radius:16px;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.04);
    overflow:hidden;
  }
  .tvbar{display:flex;gap:18px;padding:14px 18px;border-bottom:1px solid #1c2b32;font-size:12.5px;color:#7f97a2;font-weight:600;}
  .tvbar .on{color:var(--text);}
  .tvhero{
    margin:16px;border-radius:10px;height:150px;
    background:linear-gradient(120deg,#3a1f14,#1c2a2e 60%),
      radial-gradient(circle at 75% 30%, rgba(255,107,74,.35), transparent 55%);
    position:relative;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;
  }
  .tvhero .tag{font-size:10.5px;font-weight:700;color:var(--turq);letter-spacing:.04em;}
  .tvhero .title{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:600;}
  .tvgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 16px 16px;}
  .tvcard{
    aspect-ratio:2/3;border-radius:8px;
    background:linear-gradient(160deg,var(--surface-2),#0d1a20);
    position:relative;display:flex;align-items:flex-end;padding:8px;font-size:10px;font-weight:700;color:#c9d8de;
  }
  .tvcard.live::before{content:'AO VIVO';position:absolute;top:6px;left:6px;background:var(--coral);color:#1a0e08;font-size:8px;padding:2px 5px;border-radius:3px;letter-spacing:.03em;}
  .tvcats{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 18px;}
  .tvcats span{font-size:10.5px;color:#7f97a2;background:#0d1a20;border:1px solid #1c2b32;padding:5px 10px;border-radius:999px;}

  /* ---------- Sections ---------- */
  section{padding:64px 0;}
  .section-head{max-width:560px;margin:0 0 40px;}
  .section-head h2{font-size:32px;font-weight:600;margin:0 0 12px;}
  .section-head p{color:var(--text-muted);font-size:15.5px;margin:0;}

  .plans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  .plan{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);
    padding:28px 26px;display:flex;flex-direction:column;gap:16px;position:relative;
  }
  .plan.featured{border-color:var(--coral);background:linear-gradient(180deg,rgba(255,107,74,.08),var(--surface));}
  .plan .badge{
    position:absolute;top:-12px;right:24px;background:var(--coral);color:#1a0e08;
    font-size:11.5px;font-weight:800;padding:5px 12px;border-radius:999px;
  }
  .plan h3{margin:0;font-size:15px;color:var(--text-muted);font-weight:700;text-transform:none;}
  .plan .price{font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;}
  .plan .price span{font-size:14px;color:var(--text-muted);font-family:'Manrope',sans-serif;font-weight:600;}
  .plan ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:14px;color:#cfe0e6;}
  .plan ul li{display:flex;gap:9px;align-items:flex-start;}
  .plan ul li::before{content:'✓';color:var(--turq);font-weight:800;}

  .cats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .cat{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);
    padding:22px;font-weight:700;font-size:15px;
  }
  .cat span{display:block;font-size:12.5px;color:var(--text-muted);font-weight:500;margin-top:6px;}

  .faq{max-width:720px;}
  .faq-item{border-bottom:1px solid var(--line);padding:18px 0;}
  .faq-item button{
    width:100%;text-align:left;background:none;border:none;color:var(--text);
    font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;
  }
  .faq-item .a{color:var(--text-muted);font-size:14.5px;margin-top:10px;max-width:600px;display:none;}
  .faq-item.open .a{display:block;}
  .faq-item .plus{font-size:20px;color:var(--coral);font-weight:400;}

  footer{border-top:1px solid var(--line);padding:36px 0;color:var(--text-muted);font-size:13px;}
  footer .footrow{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
  footer a.admin-link{color:#5f7883;text-decoration:none;}
  footer a.admin-link:hover{color:var(--turq);}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(6,12,16,.7);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .modal{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);
    width:100%;max-width:400px;padding:30px;
  }
  .modal-tabs{display:flex;gap:6px;background:var(--ink-2);padding:4px;border-radius:999px;margin-bottom:22px;}
  .modal-tabs button{
    flex:1;border:none;background:none;padding:9px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--text-muted);
  }
  .modal-tabs button.active{background:var(--coral);color:#1a0e08;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:6px;font-weight:600;}
  .field input{
    width:100%;background:var(--ink-2);border:1px solid var(--line);border-radius:var(--radius-s);
    padding:11px 12px;color:var(--text);font-size:14.5px;font-family:inherit;
  }
  .field input:focus{outline:none;border-color:var(--turq);}
  .modal .err{color:var(--coral);font-size:13px;margin:8px 0;min-height:16px;}
  .modal .closeX{position:absolute;top:18px;right:20px;background:none;border:none;color:var(--text-muted);font-size:20px;}
  .modal{position:relative;}

  /* ---------- Client dashboard ---------- */
  .dash{padding:50px 0 100px;}
  .dash h1{font-size:30px;margin:0 0 6px;}
  .dash .sub{color:var(--text-muted);margin:0 0 34px;}
  .cardbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:24px;}
  .dash-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:20px;}
  .status-pill{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#26404a;color:var(--turq);}

  /* ---------- Floating chat ---------- */
  .message-notice{
    position:fixed;right:26px;bottom:96px;z-index:80;width:310px;max-width:calc(100vw - 40px);
    display:flex;flex-direction:column;gap:4px;text-align:left;padding:15px 17px;
    background:var(--surface-2);color:var(--text);border:1px solid var(--turq);border-radius:12px;
    box-shadow:0 14px 36px rgba(0,0,0,.45);animation:notice-in .22s ease-out;
  }
  .message-notice strong{font-size:13.5px;color:var(--turq);}
  .message-notice span{font-size:12.5px;line-height:1.4;color:var(--text);}
  .message-notice small{font-size:11px;color:var(--text-muted);margin-top:3px;}
  @keyframes notice-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .chat-badge{position:absolute;top:-4px;right:-4px;min-width:21px;height:21px;padding:2px 5px;border-radius:999px;background:var(--turq);color:#062521;font-size:11px;line-height:17px;}

  .chat-fab{
    position:fixed;bottom:26px;right:26px;width:58px;height:58px;border-radius:50%;
    background:var(--coral);border:none;box-shadow:0 10px 30px rgba(255,107,74,.35);
    display:flex;align-items:center;justify-content:center;font-size:24px;z-index:60;
  }
  .chat-panel{
    position:fixed;bottom:96px;right:26px;width:340px;max-width:88vw;height:460px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);
    display:flex;flex-direction:column;overflow:hidden;z-index:60;
    box-shadow:0 24px 60px rgba(0,0,0,.5);
  }
  .chat-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .chat-head strong{font-size:14.5px;}
  .chat-head span{font-size:12px;color:var(--text-muted);}
  .chat-body{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
  .msg{max-width:80%;padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.4;}
  .msg.client{align-self:flex-end;background:var(--coral);color:#1a0e08;border-bottom-right-radius:3px;}
  .msg.admin{align-self:flex-start;background:var(--ink-2);border:1px solid var(--line);border-bottom-left-radius:3px;}
  .msg time{display:block;font-size:10px;opacity:.65;margin-top:3px;}
  .chat-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);}
  .chat-input input{
    flex:1;background:var(--ink-2);border:1px solid var(--line);border-radius:999px;
    padding:10px 14px;color:var(--text);font-family:inherit;font-size:13.5px;
  }
  .chat-input input:focus{outline:none;border-color:var(--turq);}
  .chat-input button{background:var(--turq);border:none;color:#062521;border-radius:50%;width:38px;height:38px;font-weight:800;flex:none;}

  /* ---------- Admin dashboard ---------- */
  .admin-shell{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 65px);}
  .admin-side{border-right:1px solid var(--line);padding:22px 16px;}
  .admin-side h2{font-size:14px;color:var(--text-muted);margin:0 0 16px;text-transform:none;}
  .client-item{
    display:flex;flex-direction:column;gap:2px;padding:12px 12px;border-radius:10px;cursor:pointer;margin-bottom:4px;
  }
  .client-item:hover{background:var(--surface);}
  .client-item.active{background:var(--surface-2);}
  .client-item .name{font-weight:700;font-size:14px;}
  .client-item .preview{font-size:12.5px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .thread-status{font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:800;margin-right:4px;}
  .thread-status.open{color:var(--turq);}
  .thread-status.closed{color:#f2c66d;}
  .thread-status.archived{color:#8799a3;}
  .admin-main{display:flex;flex-direction:column;height:calc(100vh - 65px);}
  .admin-main .thread-head{padding:18px 24px;border-bottom:1px solid var(--line);}
  .admin-main .thread-head h3{margin:0;font-size:17px;}
  .admin-main .thread-head span{font-size:12.5px;color:var(--text-muted);}
  .admin-main .thread-body{flex:1;overflow-y:auto;padding:22px 24px;display:flex;flex-direction:column;gap:12px;}
  .admin-main .thread-input{display:flex;gap:10px;padding:16px 24px;border-top:1px solid var(--line);}
  .admin-main .thread-input input{
    flex:1;background:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:12px 16px;color:var(--text);font-family:inherit;
  }
  .empty-state{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:14px;text-align:center;padding:40px;}

  @media(max-width:900px){
    .hero-grid{grid-template-columns:1fr;}
    .hero h1{font-size:38px;}
    .navlinks{display:none;}
    .plans-grid{grid-template-columns:1fr;}
    .cats-row{grid-template-columns:1fr 1fr;}
    .dash-grid{grid-template-columns:1fr;}
    .admin-shell{grid-template-columns:1fr;}
    .admin-side{border-right:none;border-bottom:1px solid var(--line);}
  }

</style>
</head>
<body>

<div id="app"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
/* ============================================================
   021 TV — frontend
   Fala com o backend Node.js (server.js) via fetch() e recebe
   mensagens novas em tempo real via Socket.io.
   ============================================================ */

let state = {
  user: null,          // {username, name, role} ou null
  guestId: null,        // id do visitante, lido do cookie guestId
  view: 'landing',      // landing | client | admin
  modalOpen: null,      // 'login' | 'signup' | null
  chatOpen: false,
  chatError: '',
  adminError: '',
  notice: null,
  unreadCount: 0,
  activeClient: null,   // id (username ou guestId) selecionado no painel admin
  adminFilter: 'all',
  loading: true,
};

let socket = null;

// ---------- helpers ----------
function esc(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function timeFmt(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' ' +
    d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}
function getCookie(name) {
  const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
  return match ? decodeURIComponent(match[1]) : null;
}
async function api(path, options) {
  const res = await fetch(path, Object.assign({
    headers: { 'Content-Type': 'application/json' },
  }, options || {}));
  let data = {};
  try { data = await res.json(); } catch (e) { /* resposta vazia */ }
  if (!res.ok) throw new Error(data.error || 'Erro na requisição.');
  return data;
}

function currentChatId() {
  return state.user ? state.user.username : state.guestId;
}

function playNotificationSound() {
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    const context = new AudioContext();
    const oscillator = context.createOscillator();
    const gain = context.createGain();
    oscillator.type = 'sine';
    oscillator.frequency.setValueAtTime(740, context.currentTime);
    oscillator.frequency.exponentialRampToValueAtTime(1040, context.currentTime + 0.12);
    gain.gain.setValueAtTime(0.0001, context.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.16, context.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + 0.38);
    oscillator.connect(gain);
    gain.connect(context.destination);
    oscillator.start();
    oscillator.stop(context.currentTime + 0.4);
    oscillator.addEventListener('ended', () => context.close());
  } catch (e) { /* áudio pode ser bloqueado pelo navegador */ }
}

function notifyIncomingMessage(message, label, threadId) {
  playNotificationSound();
  state.unreadCount += 1;
  state.notice = { text: label, message: message.text, threadId };
}

function openChatFromNotice() {
  if (state.user?.role === 'admin' && state.notice?.threadId) state.activeClient = state.notice.threadId;
  state.chatOpen = true;
  state.unreadCount = 0;
  state.notice = null;
  render();
}

function notificationHTML() {
  if (!state.notice) return '';
  return `<button class="message-notice" data-action="open-chat"><strong>${esc(state.notice.text)}</strong><span>${esc(state.notice.message)}</span><small>Clique para abrir a conversa</small></button>`;
}

// ---------- bootstrap ----------
async function boot() {
  try {
    const me = await api('/api/auth/me');
    state.user = me.user;
  } catch (e) {
    state.user = null;
  }

  if (!state.user) {
    try {
      await api('/api/guest');
      state.guestId = getCookie('guestId');
    } catch (e) { /* segue sem guestId, chat cai pra estado vazio */ }
  }

  state.view = state.user ? (state.user.role === 'admin' ? 'admin' : 'client') : 'landing';
  state.loading = false;

  setupSocket();
  render();
}

function setupSocket() {
  if (socket) {
    socket.removeAllListeners();
    socket.disconnect();
  }
  socket = io();

  const joinSocketRooms = () => {
    const myId = currentChatId();
    if (myId) socket.emit('join-thread', myId);
    if (state.user && state.user.role === 'admin') socket.emit('join-admin');
  };
  socket.on('connect', joinSocketRooms);
  joinSocketRooms();

  socket.on('newMessage', (payload) => {
    const isMyThread = (state.user && state.user.role !== 'admin' && payload.threadId === state.user.username) || (!state.user && payload.threadId === state.guestId);
    const isAdmin = state.user?.role === 'admin';
    const incoming = (isAdmin && payload.message.from === 'client') || (!isAdmin && payload.message.from === 'admin');
    if (incoming && (isAdmin || isMyThread)) {
      notifyIncomingMessage(payload.message, isAdmin ? 'Nova mensagem de cliente' : 'Nova resposta do suporte', payload.threadId);
    }
    if (isMyThread || (isAdmin && payload.threadId === state.activeClient)) render();
  });

  socket.on('threadUpdated', () => {
    if (state.user && state.user.role === 'admin' && state.view === 'admin') render();
  });
}

// ---------- ações de autenticação ----------
async function doLogin(username, password, errEl) {
  errEl.textContent = '';
  try {
    const u = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ username, password }) });
    state.user = u;
    state.view = u.role === 'admin' ? 'admin' : 'client';
    state.modalOpen = null;
    setupSocket();
    render();
  } catch (e) {
    errEl.textContent = e.message;
  }
}

async function doSignup(name, username, email, password, errEl) {
  errEl.textContent = '';
  try {
    const u = await api('/api/auth/signup', { method: 'POST', body: JSON.stringify({ name, username, email, password }) });
    state.user = u;
    state.view = 'client';
    state.modalOpen = null;
    setupSocket();
    render();
  } catch (e) {
    errEl.textContent = e.message;
  }
}

async function doLogout() {
  await api('/api/auth/logout', { method: 'POST' }).catch(() => {});
  state.user = null;
  state.view = 'landing';
  state.activeClient = null;
  state.chatOpen = false;
  state.chatError = '';
  state.adminError = '';
  state.notice = null;
  state.unreadCount = 0;
  try {
    await api('/api/guest');
    state.guestId = getCookie('guestId');
  } catch (e) {}
  setupSocket();
  render();
}

// ---------- ações de chat ----------
async function sendVisitorMessage(text) {
  const id = currentChatId();
  if (!text || !text.trim() || !id) return;
  state.chatError = '';
  try {
    await api('/api/chat/' + encodeURIComponent(id), { method: 'POST', body: JSON.stringify({ text }) });
  } catch (e) {
    state.chatError = e.message;
  }
  render();
}

async function sendAdminMessage(id, text) {
  if (!text || !text.trim() || !id) return;
  state.adminError = '';
  try {
    await api('/api/chat/' + encodeURIComponent(id), { method: 'POST', body: JSON.stringify({ text }) });
  } catch (e) {
    state.adminError = e.message;
  }
  render();
}

async function changeThreadStatus(id, status) {
  if (!id) return;
  state.adminError = '';
  try {
    await api('/api/threads/' + encodeURIComponent(id) + '/status', {
      method: 'PATCH',
      body: JSON.stringify({ status }),
    });
  } catch (e) {
    state.adminError = e.message;
  }
  render();
}

function statusText(status) {
  return { open: 'aberta', closed: 'fechada', archived: 'arquivada' }[status] || 'aberta';
}

async function requestPlan(planName, planPrice) {
  await sendVisitorMessage('Olá! Tenho interesse no plano ' + planName + ' (' + planPrice + '). Pode me ajudar a assinar?');
  state.chatOpen = true;
  render();
}

// ============================================================
// RENDER
// ============================================================
async function render() {
  const app = document.getElementById('app');
  if (state.loading) { app.innerHTML = ''; return; }

  if (state.view === 'admin' && state.user) {
    app.innerHTML = await renderAdmin();
    attachAdminEvents();
    return;
  }
  if (state.view === 'client' && state.user) {
    app.innerHTML = await renderClient();
    attachClientEvents();
    return;
  }
  app.innerHTML = await renderLanding();
  attachLandingEvents();
}

// ---------- widget de chat (visitante e cliente usam o mesmo) ----------
function chatWidgetHTML(thread) {
  const msgsHTML = thread.map(m => `
      <div class="msg ${m.from}">${esc(m.text)}<time>${timeFmt(m.ts)}</time></div>
    `).join('');
  return `
  ${notificationHTML()}
  <button class="chat-fab" data-action="toggle-chat">💬${state.unreadCount ? `<b class="chat-badge">${state.unreadCount}</b>` : ''}</button>
  ${state.chatOpen ? `
  <div class="chat-panel">
    <div class="chat-head">
      <div><strong>Suporte 021 TV</strong><br><span>${state.user ? 'normalmente responde em minutos' : 'fale com a gente sem precisar cadastrar'}</span></div>
      <button class="btn-text" data-action="toggle-chat">Fechar</button>
    </div>
    <div class="chat-body" id="chatBody">${msgsHTML || '<div style="color:var(--text-muted);font-size:13px;">Nenhuma mensagem ainda. Manda um oi 👋</div>'}</div>
    ${state.chatError ? `<div class="err" style="padding:0 12px 8px;">${esc(state.chatError)}</div>` : ''}
    <form class="chat-input" id="chatForm">
      <input name="text" placeholder="Escreva sua mensagem..." autocomplete="off" required>
      <button type="submit">➤</button>
    </form>
  </div>` : ''}
  `;
}

function attachChatWidgetEvents() {
  document.querySelectorAll('[data-action="open-chat"]').forEach(el => el.onclick = openChatFromNotice);
  document.querySelectorAll('[data-action="toggle-chat"]').forEach(el => {
    el.onclick = () => { state.chatOpen = !state.chatOpen; if (state.chatOpen) { state.unreadCount = 0; state.notice = null; } render(); };
  });
  const chatForm = document.getElementById('chatForm');
  if (chatForm) {
    chatForm.onsubmit = (e) => {
      e.preventDefault();
      const fd = new FormData(chatForm);
      const text = fd.get('text');
      chatForm.reset();
      sendVisitorMessage(text);
    };
    const body = document.getElementById('chatBody');
    if (body) body.scrollTop = body.scrollHeight;
  }
}

function attachLandingEvents() {
  document.querySelectorAll('[data-action="open-login"]').forEach(el => el.onclick = (e) => { e.preventDefault(); state.modalOpen = 'login'; render(); });
  document.querySelectorAll('[data-action="open-signup"]').forEach(el => el.onclick = (e) => { e.preventDefault(); state.modalOpen = 'signup'; render(); });
  document.querySelectorAll('[data-action="close-modal"]').forEach(el => el.onclick = () => { state.modalOpen = null; render(); });
  document.querySelectorAll('[data-action="tab-login"]').forEach(el => el.onclick = () => { state.modalOpen = 'login'; render(); });
  document.querySelectorAll('[data-action="tab-signup"]').forEach(el => el.onclick = () => { state.modalOpen = 'signup'; render(); });
  const scrollBtn = document.querySelector('[data-action="scroll-plans"]');
  if (scrollBtn) scrollBtn.onclick = () => document.getElementById('planos').scrollIntoView({ behavior: 'smooth' });

  document.querySelectorAll('[data-plan]').forEach(el => {
    el.onclick = () => requestPlan(el.getAttribute('data-plan'), el.getAttribute('data-price'));
  });
  document.querySelectorAll('[data-faq]').forEach(el => {
    el.onclick = () => el.parentElement.classList.toggle('open');
  });

  const loginForm = document.getElementById('loginForm');
  if (loginForm) loginForm.onsubmit = (e) => {
    e.preventDefault();
    const fd = new FormData(loginForm);
    doLogin(fd.get('username'), fd.get('password'), document.getElementById('loginErr'));
  };
  const signupForm = document.getElementById('signupForm');
  if (signupForm) signupForm.onsubmit = (e) => {
    e.preventDefault();
    const fd = new FormData(signupForm);
    doSignup(fd.get('name'), fd.get('username'), fd.get('email'), fd.get('password'), document.getElementById('signupErr'));
  };

  attachChatWidgetEvents();
}

// ---------- ADMIN DASHBOARD ----------
async function renderAdmin() {
  let allThreads = [];
  try { allThreads = (await api('/api/threads')).threads || []; } catch (e) { state.adminError = e.message; }
  const list = state.adminFilter === 'all' ? allThreads : allThreads.filter((thread) => thread.status === state.adminFilter);

  if (!list.some((thread) => thread.id === state.activeClient)) state.activeClient = list.length ? list[0].id : null;

  const filterButtons = ['all', 'open', 'closed', 'archived'].map((filter) => `
    <button class="btn btn-sm ${state.adminFilter === filter ? 'btn-turq' : 'btn-ghost'}" data-filter="${filter}">${filter === 'all' ? 'Todas' : filter === 'open' ? 'Abertas' : filter === 'closed' ? 'Fechadas' : 'Arquivadas'}</button>
  `).join('');

  const sideHTML = list.length
    ? list.map(c => `
        <div class="client-item ${state.activeClient === c.id ? 'active' : ''}" data-client="${esc(c.id)}">
          <div class="name">${esc(c.name)} ${c.kind === 'guest' ? '<span style="font-size:10px;color:var(--text-muted);font-weight:600;">· visitante</span>' : ''}</div>
          <div class="preview"><span class="thread-status ${c.status}">${statusText(c.status)}</span> ${c.last ? esc(c.last.text) : 'sem mensagens'}</div>
        </div>`).join('')
    : `<div style="color:var(--text-muted);font-size:13px;padding:12px;">Nenhuma conversa nesta categoria.</div>`;

  let mainHTML = `<div class="empty-state">Selecione uma conversa pra ver o histórico.</div>`;
  if (state.activeClient) {
    const activeInfo = allThreads.find(c => c.id === state.activeClient);
    let chat = [];
    try { chat = (await api('/api/chat/' + encodeURIComponent(state.activeClient))).messages || []; } catch (e) { state.adminError = e.message; }
    const msgsHTML = chat.map(m => `<div class="msg ${m.from === 'admin' ? 'admin' : 'client'}" style="align-self:${m.from === 'admin' ? 'flex-start' : 'flex-end'}">${esc(m.text)}<time>${timeFmt(m.ts)}</time></div>`).join('');
    const status = activeInfo?.status || 'open';
    const statusActions = status === 'open'
      ? `<button class="btn btn-ghost btn-sm" data-status="closed">Fechar conversa</button><button class="btn btn-ghost btn-sm" data-status="archived">Arquivar</button>`
      : `<button class="btn btn-turq btn-sm" data-status="open">Reabrir conversa</button>`;
    mainHTML = `
      <div class="thread-head">
        <div><h3>${esc(activeInfo ? activeInfo.name : state.activeClient)}</h3><span>${activeInfo && activeInfo.kind === 'guest' ? 'Visitante (ainda não cadastrado)' : '@' + esc(state.activeClient)} · conversa ${statusText(status)}</span></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;">${statusActions}</div>
      </div>
      <div class="thread-body" id="adminThreadBody">${msgsHTML || '<div style="color:var(--text-muted);font-size:13px;">Nenhuma mensagem ainda.</div>'}</div>
      ${state.adminError ? `<div class="err" style="padding:0 24px 8px;">${esc(state.adminError)}</div>` : ''}
      <form class="thread-input" id="adminChatForm">
        <input name="text" placeholder="Responder..." autocomplete="off" required>
        <button class="btn btn-solid btn-sm" type="submit">Enviar</button>
      </form>`;
    if (socket) socket.emit('join-thread', state.activeClient);
  }

  return `
  <header class="site">
    <div class="wrap nav">
      <div class="brand"><span class="dot">02¹</span>021 TV <span style="font-size:12px;color:var(--text-muted);font-weight:600;margin-left:6px;">/ admin</span></div>
      <div class="navcta">
        <span class="userchip">Olá, ${esc(state.user.name)}</span>
        <button class="btn btn-ghost btn-sm" data-action="logout">Sair</button>
      </div>
    </div>
  </header>
  <div class="admin-shell">
    <aside class="admin-side">
      <h2>Histórico (${allThreads.length})</h2>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;">${filterButtons}</div>
      ${sideHTML}
    </aside>
    <section class="admin-main">${mainHTML}</section>
  </div>
  ${notificationHTML()}
  `;
}

function attachAdminEvents() {
  document.querySelectorAll('[data-action="logout"]').forEach(el => el.onclick = doLogout);
  document.querySelectorAll('[data-action="open-chat"]').forEach(el => el.onclick = openChatFromNotice);
  document.querySelectorAll('[data-filter]').forEach(el => {
    el.onclick = () => { state.adminFilter = el.getAttribute('data-filter'); render(); };
  });
  document.querySelectorAll('[data-client]').forEach(el => {
    el.onclick = () => { state.activeClient = el.getAttribute('data-client'); render(); };
  });
  document.querySelectorAll('[data-status]').forEach(el => {
    el.onclick = () => changeThreadStatus(state.activeClient, el.getAttribute('data-status'));
  });
  const form = document.getElementById('adminChatForm');
  if (form) {
    form.onsubmit = (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const text = fd.get('text');
      form.reset();
      sendAdminMessage(state.activeClient, text);
    };
    const body = document.getElementById('adminThreadBody');
    if (body) body.scrollTop = body.scrollHeight;
  }
}

boot();
